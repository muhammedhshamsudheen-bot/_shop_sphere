<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | ShopSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .detail-thumb {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 2px solid var(--surface-border);
      transition: var(--transition-fast);
      flex-shrink: 0;
    }
    .detail-thumb.active, .detail-thumb:hover {
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .variant-pill {
      padding: 6px 14px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--surface-border);
      background: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .variant-pill.active, .variant-pill:hover {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }
    @media (max-width: 850px) {
      .product-detail-layout {
        grid-template-columns: 1fr !important;
        gap: 2rem !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="top-bar">
    <div class="container top-bar-content">
      <div><i class="fas fa-truck-fast"></i> Free shipping on orders over ₹999 across India!</div>
      <div class="top-bar-links">
        <a href="shop.html">Browse Shop</a>
        <a href="orders.html">My Orders</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <i class="fas fa-bag-shopping"></i>
        <span>Shop<span>Sphere</span></span>
      </a>

      <div class="header-search">
        <div class="search-input-wrapper">
          <input type="text" class="global-search-input" placeholder="Search for items, brands, categories..." />
          <button class="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="search-suggestions-dropdown"></div>
      </div>

      <div class="header-actions">
        <a href="wishlist.html" class="nav-action-btn"><i class="far fa-heart"></i><span class="btn-text-label">Wishlist</span></a>
        <a href="cart.html" class="nav-action-btn">
          <i class="fas fa-shopping-cart"></i>
          <span class="btn-text-label">Cart</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
        <div class="auth-nav-slot">
          <a href="login.html" class="btn btn-primary btn-sm">Login</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <!-- Breadcrumb -->
    <div style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">
      <a href="index.html">Home</a> <i class="fas fa-chevron-right" style="font-size: 0.65rem; margin: 0 6px;"></i>
      <a href="shop.html">Shop</a> <i class="fas fa-chevron-right" style="font-size: 0.65rem; margin: 0 6px;"></i>
      <span style="color: var(--text-main); font-weight: 600;">Product Details</span>
    </div>

    <!-- Product Details Content Container -->
    <div id="product-details-container">
      <div class="skeleton" style="height: 500px; border-radius: var(--radius-xl);"></div>
    </div>

    <!-- Related Products -->
    <section style="margin-top: 5rem;">
      <div class="section-header">
        <div class="section-header-left">
          <h2>Related Products</h2>
          <p>You may also like these matching recommendations</p>
        </div>
      </div>
      <div class="products-grid" id="related-products-grid"></div>
    </section>
  </main>

  <!-- Review Submission Modal -->
  <div id="review-modal" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Share Your Review</h3>
        <button class="modal-close-btn" onclick="closeReviewModal()">&times;</button>
      </div>
      <form onsubmit="submitProductReview(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Overall Rating *</label>
            <select id="review-rating-select" class="form-control" required>
              <option value="5">★★★★★ 5 Stars - Excellent</option>
              <option value="4">★★★★☆ 4 Stars - Very Good</option>
              <option value="3">★★★☆☆ 3 Stars - Average</option>
              <option value="2">★★☆☆☆ 2 Stars - Below Average</option>
              <option value="1">★☆☆☆☆ 1 Star - Poor</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Review Headline / Summary</label>
            <input type="text" id="review-title-input" class="form-control" placeholder="e.g. Exceptional sound quality and battery life!" />
          </div>

          <div class="form-group">
            <label class="form-label">Detailed Review *</label>
            <textarea id="review-comment-input" class="form-control" rows="4" placeholder="What did you like or dislike? How does it perform?" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeReviewModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Review</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ShopSphere. All rights reserved.</div>
      <div class="payment-methods-icons">
        <i class="fab fa-cc-visa"></i>
        <i class="fab fa-cc-mastercard"></i>
        <i class="fas fa-qrcode"></i>
        <i class="fas fa-shield-alt"></i>
      </div>
    </div>
  </footer>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="shop.html" class="mobile-nav-item active"><i class="fas fa-store"></i><span>Shop</span></a>
    <a href="wishlist.html" class="mobile-nav-item"><i class="far fa-heart"></i><span>Wishlist</span></a>
    <a href="cart.html" class="mobile-nav-item"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="mobile-nav-badge" style="display: none;">0</span></a>
    <a href="profile.html" class="mobile-nav-item"><i class="far fa-user"></i><span>Account</span></a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/product-details.js"></script>
</body>
</html>
