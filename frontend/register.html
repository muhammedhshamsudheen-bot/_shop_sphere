<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | ShopSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body style="background: #f1f5f9;">

  <div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">
    <a href="index.html" class="brand-logo" style="margin-bottom: 2rem;">
      <i class="fas fa-bag-shopping"></i>
      <span>Shop<span>Sphere</span></span>
    </a>

    <div style="background: #ffffff; border: 1px solid var(--surface-border); border-radius: var(--radius-xl); padding: 2.5rem; width: 100%; max-width: 480px; box-shadow: var(--shadow-lg);">
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.35rem; color: var(--text-main); text-align: center;">Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.75rem;">
        Join ShopSphere to enjoy personalized shopping and exclusive deals
      </p>

      <form onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Muhammed Shamsu" required />
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 9876543210" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 chars" minlength="6" required />
          </div>

          <div class="form-group">
            <label class="form-label">Confirm Password *</label>
            <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password" minlength="6" required />
          </div>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          Create My Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const btn = document.getElementById('reg-submit-btn');

      if (password !== confirm) {
        showToast('Passwords do not match. Please verify.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

      try {
        await auth.register({ name, email, phone, password });
        setTimeout(() => { window.location.href = 'index.html'; }, 500);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Create My Account';
      }
    }
  </script>
</body>
</html>
