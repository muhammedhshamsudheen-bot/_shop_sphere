<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist | ShopSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <i class="fas fa-bag-shopping"></i>
        <span>Shop<span>Sphere</span></span>
      </a>

      <div class="header-actions">
        <a href="wishlist.html" class="nav-action-btn" style="color: var(--primary);"><i class="fas fa-heart"></i><span class="btn-text-label">Wishlist</span></a>
        <a href="cart.html" class="nav-action-btn">
          <i class="fas fa-shopping-cart"></i>
          <span class="btn-text-label">Cart</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
        <div class="auth-nav-slot"></div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 5rem;">
    <!-- Breadcrumb -->
    <div style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">
      <a href="index.html">Home</a> <i class="fas fa-chevron-right" style="font-size: 0.65rem; margin: 0 6px;"></i>
      <span style="color: var(--text-main); font-weight: 600;">Saved Wishlist</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 1.85rem; font-weight: 800;">My Wishlist</h1>
        <p style="color: var(--text-muted); font-size: 0.925rem;">Items you've bookmarked for later. Move them to your cart when ready.</p>
      </div>
      <a href="shop.html" class="btn btn-secondary btn-sm"><i class="fas fa-store"></i> Explore More</a>
    </div>

    <!-- Empty Wishlist -->
    <div id="empty-wishlist-state" style="display: none; text-align: center; padding: 5rem 1rem; background: #ffffff; border-radius: var(--radius-xl); border: 1px solid var(--surface-border); box-shadow: var(--shadow-sm);">
      <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: #94a3b8; font-size: 2.5rem;">
        <i class="far fa-heart"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem;">Your Wishlist is Empty</h2>
      <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 1.75rem;">Save your favorite electronics, sneakers, and fashion items to buy later.</p>
      <a href="shop.html" class="btn btn-primary btn-lg">Browse Store</a>
    </div>

    <!-- Wishlist Grid -->
    <div class="products-grid" id="wishlist-grid"></div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="shop.html" class="mobile-nav-item"><i class="fas fa-store"></i><span>Shop</span></a>
    <a href="wishlist.html" class="mobile-nav-item active"><i class="far fa-heart"></i><span>Wishlist</span></a>
    <a href="cart.html" class="mobile-nav-item"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="mobile-nav-badge" style="display: none;">0</span></a>
    <a href="profile.html" class="mobile-nav-item"><i class="far fa-user"></i><span>Account</span></a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/wishlist.js"></script>
</body>
</html>
