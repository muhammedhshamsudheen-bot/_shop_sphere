<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Operations Portal | ShopSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="admin-wrapper">
    <!-- Admin Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <i class="fas fa-shield-halved" style="color: var(--primary); font-size: 1.5rem;"></i>
        <div>
          <h3>ShopSphere</h3>
          <span style="font-size: 0.72rem; color: #64748b; font-weight: 700; text-transform: uppercase;">Admin Portal</span>
        </div>
      </div>

      <ul class="admin-nav">
        <li class="admin-nav-item">
          <a class="admin-nav-link active" data-tab="overview" onclick="switchAdminTab('overview')">
            <i class="fas fa-chart-pie"></i> Overview
          </a>
        </li>
        <li class="admin-nav-item">
          <a class="admin-nav-link" data-tab="products" onclick="switchAdminTab('products')">
            <i class="fas fa-boxes-stacked"></i> Products
          </a>
        </li>
        <li class="admin-nav-item">
          <a class="admin-nav-link" data-tab="orders" onclick="switchAdminTab('orders')">
            <i class="fas fa-truck-ramp-box"></i> Orders
          </a>
        </li>
        <li class="admin-nav-item">
          <a class="admin-nav-link" data-tab="customers" onclick="switchAdminTab('customers')">
            <i class="fas fa-users-gear"></i> Customers
          </a>
        </li>
        <li class="admin-nav-item">
          <a class="admin-nav-link" data-tab="coupons" onclick="switchAdminTab('coupons')">
            <i class="fas fa-tags"></i> Coupons
          </a>
        </li>
        <li class="admin-nav-item">
          <a class="admin-nav-link" data-tab="reports" onclick="switchAdminTab('reports')">
            <i class="fas fa-chart-line"></i> Analytics & Reports
          </a>
        </li>
      </ul>

      <div style="padding: 1.5rem; border-top: 1px solid #1e293b;">
        <a href="index.html" class="btn btn-secondary btn-sm btn-block" style="background: #1e293b; color: #fff; border: none;">
          <i class="fas fa-external-link-alt"></i> Back to Store
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
      <div class="admin-topbar">
        <h2 id="admin-page-title">Store Overview & Analytics</h2>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700;">
              A
            </div>
            <div>
              <div style="font-weight: 700; font-size: 0.875rem;">Administrator</div>
              <div style="font-size: 0.75rem; color: #10b981;"><i class="fas fa-circle" style="font-size: 0.5rem;"></i> Active Session</div>
            </div>
          </div>
          <button onclick="auth.logout()" class="btn btn-secondary btn-sm" style="color: var(--danger);">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>

      <div class="admin-content" id="admin-tab-content">
        <!-- Rendered via js/admin.js -->
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
