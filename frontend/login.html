<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | ShopSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body style="background: #f1f5f9;">

  <div class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">
    <!-- Logo -->
    <a href="index.html" class="brand-logo" style="margin-bottom: 2rem;">
      <i class="fas fa-bag-shopping"></i>
      <span>Shop<span>Sphere</span></span>
    </a>

    <!-- Auth Card -->
    <div style="background: #ffffff; border: 1px solid var(--surface-border); border-radius: var(--radius-xl); padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.35rem; color: var(--text-main); text-align: center;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.75rem;">
        Sign in to access your cart, saved orders, and wishlist
      </p>

      <!-- Demo Accounts Quick Fill -->
      <div style="background: var(--surface-alt); border: 1px solid var(--surface-border); border-radius: var(--radius-md); padding: 12px; margin-bottom: 1.5rem;">
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 8px;">
          ⚡ Quick 1-Click Demo Login
        </span>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFillDemo('customer')" style="flex: 1; font-size: 0.78rem;">
            <i class="fas fa-user"></i> Customer Demo
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFillDemo('admin')" style="flex: 1; font-size: 0.78rem; color: var(--primary);">
            <i class="fas fa-shield-alt"></i> Admin Demo
          </button>
        </div>
      </div>

      <form onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="#" onclick="showToast('Use demo password: Customer@12345 or Admin@12345', 'info')" style="font-size: 0.78rem; color: var(--primary); font-weight: 600;">Forgot password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
            <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 700;">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function quickFillDemo(role) {
      if (role === 'customer') {
        document.getElementById('login-email').value = 'customer@shopcart.com';
        document.getElementById('login-password').value = 'Customer@12345';
      } else {
        document.getElementById('login-email').value = 'admin@shopcart.com';
        document.getElementById('login-password').value = 'Admin@12345';
      }
    }

    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="far fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="far fa-eye"></i>';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await auth.login(email, password);
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || (res.user.role === 'admin' ? 'admin.html' : 'index.html');
        setTimeout(() => { window.location.href = redirect; }, 400);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }
  </script>
</body>
</html>
