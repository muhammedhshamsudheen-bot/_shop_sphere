<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | ShopSphere</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- Razorpay Official Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner" style="height: 68px;">
      <a href="index.html" class="brand-logo">
        <i class="fas fa-bag-shopping"></i>
        <span>Shop<span>Sphere</span></span>
      </a>

      <div style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 700; color: #10b981;">
        <i class="fas fa-lock"></i> 256-Bit Encrypted Secure Checkout
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 5rem;">
    <!-- Stepper Navigation -->
    <div class="checkout-stepper">
      <div class="step-item active" data-step="1">
        <div class="step-bubble">1</div>
        <div class="step-label">Review</div>
      </div>
      <div class="step-item" data-step="2">
        <div class="step-bubble">2</div>
        <div class="step-label">Address</div>
      </div>
      <div class="step-item" data-step="3">
        <div class="step-bubble">3</div>
        <div class="step-label">Delivery</div>
      </div>
      <div class="step-item" data-step="4">
        <div class="step-bubble">4</div>
        <div class="step-label">Summary</div>
      </div>
      <div class="step-item" data-step="5">
        <div class="step-bubble">5</div>
        <div class="step-label">Payment</div>
      </div>
      <div class="step-item" data-step="6">
        <div class="step-bubble">6</div>
        <div class="step-label">Complete</div>
      </div>
    </div>

    <!-- 2 Columns Checkout Grid -->
    <div style="display: grid; grid-template-columns: 1fr 380px; gap: 2rem;" class="cart-layout">
      <!-- Left Step Content Container -->
      <div id="checkout-step-content">
        <div class="skeleton" style="height: 400px; border-radius: var(--radius-lg);"></div>
      </div>

      <!-- Right Summary Container -->
      <div id="checkout-sidebar-summary"></div>
    </div>
  </main>

  <!-- Add New Address Modal -->
  <div id="address-modal" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Add Delivery Address</h3>
        <button class="modal-close-btn" onclick="closeNewAddressModal()">&times;</button>
      </div>
      <form onsubmit="handleSaveNewAddress(event)">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" id="addr-name" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label">10-Digit Mobile Phone *</label>
              <input type="tel" id="addr-phone" class="form-control" pattern="[0-9]{10}" placeholder="9876543210" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Flat, House no., Building, Company *</label>
            <input type="text" id="addr-street" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label">Area, Colony, Street, Sector, Village</label>
            <input type="text" id="addr-apt" class="form-control" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">City *</label>
              <input type="text" id="addr-city" class="form-control" required />
            </div>
            <div class="form-group">
              <label class="form-label">State *</label>
              <input type="text" id="addr-state" class="form-control" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">PIN Code (6 digits) *</label>
              <input type="text" id="addr-pin" class="form-control" pattern="[0-9]{6}" placeholder="560001" required />
            </div>
            <div class="form-group" style="display: flex; align-items: flex-end; padding-bottom: 12px;">
              <label style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem; cursor: pointer;">
                <input type="checkbox" id="addr-default" /> Make this my default address
              </label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeNewAddressModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Address</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ShopSphere. All payments verified securely via Razorpay gateway.</div>
      <div class="payment-methods-icons">
        <i class="fab fa-cc-visa"></i>
        <i class="fab fa-cc-mastercard"></i>
        <i class="fas fa-qrcode"></i>
        <i class="fas fa-shield-alt"></i>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
